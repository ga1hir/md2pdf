[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md2pdf"
version = "0.1.0"
description = "純Python・外部ツール非依存の Markdown→PDF 変換ツール（書籍ページ数確認＋受け渡し用）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ga1hir" }]
dependencies = [
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "Pygments>=2.17",
    "reportlab>=4.0",
    "matplotlib>=3.7",
    "svglib>=1.5",
    "resvg-py>=0.3",
    "watchdog>=3.0",
]

[project.optional-dependencies]
# フォント生成（python -m md2pdf.fetch_fonts）用。出力をハッシュ照合するため版を固定する。
fonts = ["fonttools==4.60.2", "otf2ttf==0.2", "cu2qu==1.6.7.post2"]

[project.scripts]
md2pdf = "md2pdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
md2pdf = ["fonts/*.otf", "fonts/*.ttf", "fonts/*.ttc", "fonts/LICENSE*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
